<!DOCTYPE html><script type="application/json" id="cowork-artifact-meta">
{
  "name": "Triggers",
  "schemaVersion": 1,
  "description": "Triggers panel — tap to run a block's skill (Route · Book Distill · Learning Block Agenda · WilmU Update). Buttons call the matching scheduled task; output lands on the Roam daily page.",
  "mcpTools": [],
  "mcpServerNames": []
}
</script>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triggers</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #ffffff;
  color: #1a1a1a;
  padding: 18px;
}
h1 { font-size: 16px; font-weight: 700; margin: 0 0 2px; letter-spacing: .2px; }
.sub { font-size: 12px; color: #6b6b6b; margin: 0 0 16px; }
.card {
  border: 1px solid #e3e3e3;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 12px;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.meta { min-width: 0; }
.name { font-size: 14px; font-weight: 600; margin: 0 0 3px; }
.desc { font-size: 12px; color: #6b6b6b; margin: 0; line-height: 1.35; }
button.run {
  flex: 0 0 auto;
  border: none;
  border-radius: 8px;
  background: #1a1a1a;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 16px;
  cursor: pointer;
  transition: background .15s, opacity .15s;
}
button.run:hover { background: #333; }
button.run:disabled { opacity: .55; cursor: default; }
.status { font-size: 11px; margin-top: 6px; min-height: 14px; }
.status.ok { color: #1f7a3d; }
.status.err { color: #b22; }
.foot { font-size: 11px; color: #9a9a9a; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Triggers</h1>
  <p class="sub">Pull, don't push. Fire a block only when you're ready &mdash; output lands on today's Roam daily page.</p>

  <div id="cards"></div>
  <p class="foot">Runs in the background. Give it a moment, then check your Roam daily note.</p>

<script>
  const TASKS = [
    {
      id: "daily-route",
      name: "🧭 Route",
      desc: "Sweep untagged blocks off your daily pages, send each to its home — book→Distill, task→Tasks, personal→🏡. (Also runs nightly ~9:30pm.)"
    },
    {
      id: "second-brain-distill",
      name: "📖 Book Distill",
      desc: "Route #Book + literature captures into the zettelkasten notes bank + claims — the whole second brain, not just the manuscript."
    },
    {
      id: "learning-block-agenda",
      name: "🎧 Learning Block Agenda",
      desc: "What to practice next — Spanish · voice · ukulele (the deciding you run out of gas on)."
    },
    {
      id: "wilmu-update",
      name: "🎓 WilmU Update",
      desc: "Status-only refresh of [[WilmU Block]] — what's done · where you are · next action."
    }
  ];

  const wrap = document.getElementById("cards");

  TASKS.forEach(function (t) {
    const card = document.createElement("div");
    card.className = "card";

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("p");
    name.className = "name";
    name.textContent = t.name;
    const desc = document.createElement("p");
    desc.className = "desc";
    desc.textContent = t.desc;
    const status = document.createElement("div");
    status.className = "status";
    meta.appendChild(name);
    meta.appendChild(desc);
    meta.appendChild(status);

    const btn = document.createElement("button");
    btn.className = "run";
    btn.textContent = "Run";

    btn.addEventListener("click", async function () {
      status.className = "status";
      status.textContent = "";
      if (!window.cowork || typeof window.cowork.runScheduledTask !== "function") {
        status.className = "status err";
        status.textContent = "Run unavailable in this view.";
        return;
      }
      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = "Running…";
      try {
        await window.cowork.runScheduledTask(t.id);
        status.className = "status ok";
        status.textContent = "Sent — check your Roam daily note shortly.";
        btn.textContent = "Run again";
      } catch (e) {
        status.className = "status err";
        status.textContent = "Couldn't start: " + (e && e.message ? e.message : "unknown error");
        btn.textContent = label;
      } finally {
        btn.disabled = false;
      }
    });

    card.appendChild(meta);
    card.appendChild(btn);
    wrap.appendChild(card);
  });
</script>
</body>
</html>
