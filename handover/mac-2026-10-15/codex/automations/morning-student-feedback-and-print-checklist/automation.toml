prompt = "Current teacher instructions, October 13, 2026: new print-ready SchoolHub student documents must be delivered automatically to katherine.vonduyke@redclay.k12.de.us. Katherine uses Hub controls only when the automatic routine fails. Keep this existing weekday 7:30 a.m. America/New_York routine and its existing chat, schedule and ownership. Do not create a second schedule. Do not require per-run email approval, since Katherine explicitly authorized these documents and this school destination.\n\nAfter newly saved critical-aspect feedback, science-writing reports and eligible missing-work contracts have passed their existing source, identity, filing and print-readiness checks, drain the canonical Hub print-ready email outbox. Its authenticated endpoint is /v2/api/feedback/email/outbox, implemented by hub_v2.print_ready_email. Use the deployed contract and supported existing trusted-host helpers; never forge IAP headers, copy credentials/cookies or invent an endpoint. The existing school Gmail connector is the sender. Confirm its profile is katherine.vonduyke@redclay.k12.de.us; send only to that exact school address, with no CC/BCC and no student/guardian notices in this operation.\n\nThe existing approved trusted-host adapter is /Users/katherinevonduyke/Documents/Claude/2026-10-02/other-x20/outputs/oct13-print-ready-email/email_outbox_worker.py. Run it with /Users/katherinevonduyke/Documents/Claude/2026-10-02/other-x20/work/.venv-actual-received-validation/bin/python, using absolute paths regardless of this chat's working directory. Preserve that helper and its pinned source checkout at /Users/katherinevonduyke/Documents/Claude/2026-10-02/other-x20/work/oct13-print-ready-email. Its --action accepts status, prepare, begin_send, confirm_sent or hold_uncertain; always supply --result-file with a fresh private evidence path. prepare additionally accepts --payload-file for a private ready-to-send Gmail MIME JSON. The adapter verifies the complete attachment hash, uses only existing approved service identities, and never sends Gmail itself or outputs credentials. Do not change its pinned module or runtime-config checks to force execution.\n\nFor begin_send, supply --request-file containing {\"id\": the prepared batch ID}. For confirm_sent, the private request contains id, claim_token, message_id, labels and raw_base64 copied from the actual school Gmail API raw readback. For hold_uncertain it contains id and claim_token. The result file wraps the exact canonical response in its result field. Load the prepared private connector payload into the school Gmail send tool without printing its PDF base64; preserve the exact sender, recipient, subject and attachment. The --action status response exposes manual_seed_details and active_batch_details for exact setup/recovery proof. The worker must not reactivate, replace the historical baseline or import another manual seed.\n\nRead configured outbox status, then use prepare to obtain one immutable incremental print packet containing only eligible unsent exact document versions. Download and verify its complete private PDF and exact manifest before begin_send. Honor the outbox activation baseline; do not retroactively email old reports, previously printed packets or already-covered source versions. Preserve a single long print document with all new included classes/report types. If a later packet grows from A to A+B, email only the new B contribution. Do not use Printed/Handed checkboxes as email deduplication. Declan's corrected three-page report was already emailed on October 13: Drive file13jvy3LNA0c-cJHPqpT1r_NmlPZWtjnsx, PDF SHA256c258d764f40fbab7d4fe37c69fc80ed72758214eca6882ee3c2bdb6c05ceea3b, Gmail message1a135b4133f645f4. Read back its seeded verified receipt in the canonical outbox before sending; if that setup proof is absent, report the setup failure and do not resend this corrected PDF.\n\nClaim the exact batch through begin_send immediately before one school Gmail send. Require send_allowed_once to be true in that first successful reply; status alone or a repeated readback never grants send authority. Preserve its unique claim_token privately and pass it to confirm_sent or hold_uncertain; a repeated begin_send is not new authority to send. Use the returned manifest and pdf_url to verify the exact immutable attachment. Immediately before the Gmail call, compare real current UTC with the returned expires_at when present; if the contract evidence has expired, hold that reserved batch rather than sending or recomputing it. Attach the exact prepared PDF and use the outbox's subject/recipient, explaining that this is new print-ready work. Record the send intent durably first. After sending, read the actual Gmail message, including raw MIME; verify SENT, exact school sender and recipient, subject, attachment bytes/hash and source manifest. Call confirm_sent only with that verified readback and the exact claim_token. An interrupted, timed-out or uncertain send must call hold_uncertain with the claim_token when possible and must never be retried automatically or on a later run. Reconcile Gmail Sent and attachment bytes against the exact reservation before any recovery. A reservation is not proof of a send; a confirmed email is not proof of paper printing or handing out. Leave Printed and Handed out entirely teacher-controlled. Do not mark these fields because an email arrived.\n\nAfter a batch is confirmed sent, prepare the next eligible batch until none remain, bounded to at most ten batches in this run. The normal packet supports up to 200 reports and a 10MB PDF. If a limit requires multiple packets, label the body of each email as a numbered part, leave the outbox's exact subject unchanged, and send each prepared attachment once; do not imply a partial packet contains the whole day's work. If the bounded loop leaves pending items, report that partial coverage. Never continue sending after uncertainty, loss of the send fence, expired reserved evidence or a failed exact Gmail readback. The deployed prepare operation may retire expired unreserved contracts so unrelated verified feedback can proceed; never alter or regenerate a reserved/uncertain batch.\n\nRead the outbox before and after generation so a generation/provider hold does not prevent delivery of other already verified new documents. If no eligible new versions exist, send no empty email and stay quiet. Report a meaningful delivery failure or required action with exact document/class/lesson context and the smallest recovery step. Preserve saved PDFs and the stopped receipt. Hub Print/download controls remain the fallback, and must not regenerate unchanged reports or cause a duplicate email. After verified automatic email delivery, do not instruct Katherine to open Hub Today or click Print all feedback. This overrides older mandatory Hub-print directions below. Point her to the emailed attachment; give Hub recovery controls only for a genuine delivery failure or at her request.\n\nUpdated science-writing format overrides any older generic-question direction for that report type: use saved attributed observations, not a new unrequested rerating. An explicitly authorized first-correction comparison, such as Declan's October 13 correction, explains both reviewed pieces and why any levels changed. Otherwise descriptions cover only the latest actually reviewed piece. Show four colorful line graphs with one point per distinct submitted/reviewed piece, including separate pieces in the same lesson and explicit unrated gaps. Do not collapse pieces into lesson averages or imply a growth order from lesson labels or file-created dates. On a separate writing page, replace generic discussion questions with a relatively easy CER based on the latest reviewed lesson: give three reviewed science evidence facts, ask for a claim and explicit reasoning connections, and provide writing lines. Keep this supplied practice evidence separate from attributed student evidence. Paper CER is unassessed unless its returned paper is actually reviewed. Retain the existing approved critical-aspect feedback format for that separate report type.\n\nAll remaining source, privacy, roster, assessment, IC, history, checklist and filing instructions below remain in force. The teacher-email authorization does not authorize parent notices, new grading, source changes, sharing changes or paid provider retries.\n\nAt 7:30 a.m. America/New_York on weekdays, use Remote Desktop Commander, the signed-in school account katherine.vonduyke@redclay.k12.de.us, and the authenticated School Workflow Hub at https://school-workflow-hub-611166743877.us-central1.run.app/v2/ to prepare new eligible feedback for Biology, both Forensics sections and A&P. Use each class's latest closed lesson and newly completed revisions without existing feedback. Read the live Agenda Prompt 2 and exact registered lesson and student sources. Tidying belongs to the separate 6:30 task; do not move original submissions here. Do not score completion, change grades, IC flags, Forms, source content or sharing, or send student messages.\n\nUse the current approved one-page ninth-grade student feedback format, with exact critical-aspect levels and attributable quotes, one focused question and writing space, the approved reflection/hand-back instruction and improvement space. Printed directions or coaching text are not student evidence. Separate current understanding from demonstrated growth: a first/revised box in one file alone proves no chronology. Read historical evidence before claiming change. Preserve earlier reports. Reuse an unchanged verified draft or saved PDF without another model call; a lost or interrupted provider/save response requires exact readback, never blind retry or re-billing. A missing or inaccessible source is a hold, never proof of no work. Commitment feedback requires a complete source check and the verified two-week eligibility window; do not invent levels or quotes.\n\nSave each individual feedback PDF once in that student's existing private class folder, alongside the actual copied work. Use the current deployed student archive locations, stable IDs and private access checks; do not use retired destination IDs or create duplicate student folders. Verify content, destination and index before reporting delivery. If filing is blocked, keep the saved Hub report and name the blocker without regenerating it. Existing reports may be filed by the authorized unique fresh course/section/name evidence; new assessment identity and lesson gates remain strict. The intentionally retired Student answers — Biology Sheet must not be recreated or treated as missing.\n\nBiology also needs separate science-writing feedback on vocabulary, conceptual explanations, specific evidence and reasoning that connects evidence to a claim. Use exact attributed student excerpts and the four-level scale; unavailable evidence and Not assessed are separate from Beginning. Keep this student report separate from the critical-aspect feedback, file it individually, and include its new saved date in the day's long print document. Teacher-only details belong in the separate Biology analysis Sheet. Update the existing Biology-only DTGSS whole-class report and dated lesson teaching actions; its first page explains every tab. Preserve manual teaching-plan checkboxes and notes. Never put named student evidence in the class-only DTGSS report. Teacher report filenames start with the exact cycle number, or 00 for general reports, and remain in separate teacher folders.\n\nRefresh the one existing work-and-feedback index, with direct links, original submission dates, saved feedback dates, class, lesson and exact holds; the same Sheet is accessible from 00AIHS. Maintain the existing Feedback checklist 2026–27 in SchoolHub, with four class tabs, students as rows, weeks/cycles and separate lessons as column groups, and native Made, Printed and Handed out checkboxes. Printed and Handed out are Katherine-controlled and must never be inferred or reset. Preserve all notes and historical states. Made is true only after the exact student/report/revision has been saved and verified. Made this run is true only for actual new/revised individually filed reports in this execution; unchanged historical feedback is false. Archive the prior run note and record this execution's date, identifier, coverage, completion/partial/blocked state and new-report count. Give science-writing reports their own group. Preserve old revision groups and append new ones rather than overwriting teacher marks.\n\nAfter individual filing, finalize one immutable all-class daily document through the deployed feedback/daily endpoint for the actual Eastern saved-feedback date. Include every verified individual critical-aspect and science-writing report for that date; exclude teacher reports and suppress only proven duplicate representations. Read back the entire saved PDF, page order, source manifest and private destination. Link it to Hub Today and the current Agenda records view. Compiling an older report today does not make it new, change its saved date or mark Made this run. Show old/printed work under dated reprint history; if nothing new was verified today, say so rather than offering old feedback as new.\n\nKeep Hub reference records behind the configured private Hub records folder. Reuse the canonical class folders, checklist, index, reports and daily document instead of adding repeated navigation. Do not physically print. End a completed run with one explicit direction: open Hub Today and choose Print all feedback for the displayed new date; for a requested reprint, use the exact historical date. Include new-report count and any affected class/student/lesson with a working link and precise blocker. Never claim live completion from a trigger, draft or schedule. Continue independent safe work when blocked. Stay quiet when unchanged and non-actionable; notify only on new ready feedback, verified completion, a changed failure or a concrete decision needed.\n\nOctober 9 report and current-contract rules:\nCURRENT HUB WORKFLOW — 2026-10-09\n\nUse Infinite Campus as the canonical current class/section roster. Omit withdrawn or Hub-only students from current assignment operations while retaining their historical work. Read IC assignment flags: Exempt is already handled and is not a teacher attention item.\n\nBefore calling work missing, check the assignment's current Form file references, lesson folders, earlier/shared intake, and the actual unsorted folder. Tidy identified work before scoring, preserve original sources, and file verified copies with the student's work and feedback. Empty or inaccessible sources, ambiguous identities and unreadable submissions are coverage holds, not zeros. A zero IC score or an unrated explanation is not missing-work evidence.\n\nBind the submitted lesson to its actual Form and assignment identity. An approved alternate lesson submitted through a shared Form may belong there. If a folder contains two lessons and the relationship is not already verified, report the class, lesson, student and exact uncertainty and ask whether both belong there. Do not guess from a similar title or move ambiguous work.\n\nFor authorized mapped IC entry, fill a blank or raise a lower score only when the current verified Hub score is higher. Keep higher IC scores, Exempt flags and grade history. Save and read back the exact assignment/student cells. If save or readback is uncertain, stop further writes and explain the exact class/lesson and recovery step. End with a clear review direction; do not ask the teacher to save again after a verified save.\n\nCompletion arithmetic below is unchanged. Science-writing analysis is a separate feedback workflow and must never replace completion scores or invent conceptual ratings from them. Its student report uses source-backed vocabulary, conceptual-answer, evidence and reasoning observations, colored Beginning/Developing/Proficient levels and a separate colorful graph for each area. Use actual reviewed work dates, preserve unavailable evidence as gaps, and do not call a single point a trend. Preserve each student's individual challenge; put the invitation and lined practice on page two.\n\nBefore each new daily print packet, derive current supportive missing-work contracts from complete fresh sources, IC roster/assignment flags, factual due dates and private folders. Exclude Exempt, unassigned, newly joined, future-due or verified extended work. A located submission closes that assignment's contract. Keep existing extensions and grades unchanged; if extension status is unavailable, say \"Work not located as of [check date]\" and invite the student to show another submission or make a plan. Combine that student's current missing lessons on one contract page. Do not reuse old contracts as evidence of current absence.\n\nInclude saved student feedback, separate science-writing reports and verified current contracts in one dated all-class print PDF, with individual copies in each student's class folder. Link the exact combined PDF on Hub Today. Teacher analyses and class records belong in separate private class Teacher reports folders; keep the Biology whole-class report and separate student writing analysis distinct. Keep the feedback checklist in SchoolHub and preserve teacher-controlled Printed and Handed-to-student states. A print-ready PDF is not proof that paper printed.\n\nKeep the existing Student Feedback — Private source folder: it contains original intake and history. Never delete it based on the existence of student copies. Do not restore the retired Student answers — Biology spreadsheet.\n\nCurrent readiness and roster rules (October 9):\nInclude the IC course 9999-8 Study Halls in complete roster updates, using its verified section identity and roster-only destination. Keep that population separate from submission/grade identity matching so students enrolled in another class are not duplicated. A partial Study Hall scan preserves its last complete roster and reports the exact access failure. File withdrawn students' verified historical copies under the class's Former students folder while preserving original files and grade history.\n\nUse the teacher-facing phrase, \"Needs embedded codes\", for a teacher lesson requiring code repairs and the specific Biology Week 06 Photosynthesis student-copy exception. For every other readable, identified, correctly matched received student copy, missing codes, missing scores or unfinished work must not hold its completion grade. Count only the Notes, Concept Bank and revision codes actually found in that copy; retain its coded required blanks in the denominator, count meaningful work actually present and grade mistakes too. Do not borrow absent codes or newer tasks from the teacher version, and do not count supplied examples such as Carbon’s Grass. Missing source access, uncertain identity, a wrong lesson or an unsupported ambiguous response remain separate named problems. Every true hand check must give the class, week, lesson, student, exact slide numbers, working source link and precise decision needed. Explain the named class/week/lesson and the needed repair in ordinary language; do not expose parser diagnostic names. Completion readiness checks embedded codes only and never requires teacher reference contracts on slides. Source access failures stay distinct from missing codes. A coded teacher deck does not clear the teacher-confirmed Biology Week 06 Photosynthesis hold on already distributed uncoded copies. Embed codes in the existing copies, preserving answers, verify their actual revisions and teacher confirmation, then rerun grades. Until then do not prepare any cached score or missing-work zero for the assignment.\n\nRead the live Agenda and its exact current deck pointers when a teacher reports a replacement, including Forensics Week 07. Verify native Slides or supported PowerPoint content and source revisions; do not require conversion merely because a file is PowerPoint, and do not relink a similarly named file without exact lesson confirmation.\n\nThe Hub calendar offers four weeks of selectable dates. The existing checklist has separate Science Writing and Current work contracts groups, each with Made, Printed and Handed out. Made this run reflects either newly saved report type; preserve all previous weekly and teacher delivery marks.\n\nActual week-folder rule:\nFor every class/week, open the actual registered week folder and list all current untrashed lesson files, verifying exact IDs, parents and versions. This folder inventory and the current Agenda cell links determine the files to check; a matching lesson title or a cached/hidden old link does not. Exclude trashed decks, never restore them as a readability repair, and report a stale Agenda pointer with its exact cell and current folder context. When a teacher has replaced the deck, reread those current sources before code checks or grading. If multiple current lessons/decks are present and their assignment relationships are unverified, name them with working folder/file links and ask which belong there. Do not count a trashed file as a second required deck.\n\nCurrent verified teacher decisions (October 10): Carbon’s Grass is an example and does not count. Types of Evidence’s brainstorm and partner comparison count as received Notes activities; do not ask for that approval again. Investigative Processes and Types of Evidence may share their verified existing folder; recognize each file’s actual registered lesson. Never clear an uncertain IC save automatically. If the existing school IC session expires, choose Google SSO and Katherine’s school account, allowing the existing browser autofill without reading or exposing the password. Add the Photosynthesis student-copy repairs as the final checklist step: obtain the exact existing distributed copies from Agenda page one, add the missing embedded codes without changing answers or history, verify the actual saved files, rerun grades, then verify eligible higher IC entries. Do not treat an empty upload folder as proof that distributed copies do not exist. Keep teacher-controlled Printed and Handed out marks unchanged."
