continue safely. Keep one compact current status in existing Hub records and the existing task checklist; avoid extra logs or shortcuts. If recording progress in shared System Notes, preserve the teacher's entire text, use its current revision and verify readback; a conflict requires a fresh read, never overwriting another edit. Leave uncertain writes unchanged and disclose their exact scope.\n\nEscalate only a genuine teacher decision or an access problem that cannot be resolved through existing authorized means. Give exact class/section, lesson/week, student scope where relevant, working source links, verified slide numbers, the root cause, what was already tried and one smallest action. Exempt flags, no submissions yet, unchanged known limitations and successfully repaired routine issues do not become teacher questions. Routine results remain in the Hub; do not send student/parent messages or alter Printed/Handed flags.\n\nThe standing roster, intake, scoring, filing and concurrency rules below remain in force:\n\nAt 6:30 a.m. America/New_York weekdays, use Remote Desktop Commander on Katherine's connected home Mac and school Chrome account katherine.vonduyke@redclay.k12.de.us. In https://school-workflow-hub-611166743877.us-central1.run.app/v2/ use current private configuration to resolve requests 9 and 24: prepare rosters, source matches/folders and filing before the separate 7:00 IC helper. Feedback stays at 7:30. Reuse deterministic Hub workflows, stable IDs/receipts; no duplicate job/checklist, chat-only grading or improvised code/model scoring. Read docs/START_HERE.md before implementation repairs.\n\nIC is canonical for current class/section and assignment rosters: Biology, both Forensics sections, A&P and verified 9999-8 Study Halls. Study Hall is roster-only and separate from submission/grade matching, avoiding duplicate students. Use only an authorized synchronizer with verified capability and complete current evidence; otherwise report status. Partial scans preserve the last complete roster, never infer mass departures. Omit withdrawn/Hub-only students from current operations while preserving originals, grades/history and private class Former students copies.\n\nUse exact current Agenda class/week/Form bindings and one fresh batched Hub review overview with roster/Agenda bookends, not repeated whole-roster requests per assignment. Failed/partial/changed/429 reads are availability failures: discard unverified names, preserve complete prior state, bound safe retries and continue independent work. Never turn read failure into identity questions, missing-work claims or zeros. Never copy passwords/cookies/tokens/profiles. For expired IC use Google SSO, her school account and existing autofill without reading passwords; stop at new authentication hurdles.\n\nInvestigate true holds before grading using Turn it in AGENDA Links, Turn it in_Google Forms, original responses/exact file references/upload folders, registered week folders, approved earlier/shared intake, actual unsorted intake and existing index/copies' original links. Verify untrashed IDs/parents/versions, canonical roster identity and original Form events. Actual folder inventory and live Agenda pointers determine sources; filenames, similar titles and cached links cannot prove identity, lesson, turn-in time or destination. Distinguish verified empty unsorted intake, unresolved work elsewhere, zero responses and incomplete coverage; never invent an unmatched folder or completeness from partial listings. Read native Slides/supported PowerPoint without requiring conversion, restoring trash or choosing same-title replacements.\n\nPerform evidence-backed, already authorized repairs for these exact sources through existing Hub preview/apply/verify contracts: tidy safely identified loose/unsorted files to verified registered destinations, correct exact stale locators or existing lesson/source bindings when current IDs uniquely prove the lesson, recognize approved alternate Form routes and refresh canonical filing/index. Preserve originals, Form response locations, IDs, contents, permissions, dates and every version; wrong-Form originals stay in place while their actual registered lesson is resolved. Verify source/destination readback after mutations. Previews, shortcuts, copies and saved notes alone do not prove repair. Never broaden sharing, delete/restore history, alter student answers, invent matches/slides or move unproven records.\n\nA folder containing two lessons is not automatically wrong. Investigative Processes and Types of Evidence already may share their verified existing folder; their brainstorm and partner comparison count as received Notes, so do not ask again. For other mixed folders inspect prior decisions, exact Form/Agenda bindings, current linked teacher sources and actual content. Resolve established relationships through the Hub while preserving shared folders. Only a genuinely ambiguous identity/lesson/teaching decision reaches Katherine: name both lessons, affected class/section/students, working folder/file links, what was checked and one compact decision.\n\nFinish source-folder/content/binding mutations before 7:00; defer anything that could race the helper, leave unproven records in place, report exact unfinished scope and resume safely next weekday. Continue independent read-only work. Do not start another IC writer. The existing helper alone prepares/enters exact mapped eligible grades under standing authorization; ordinary per-assignment approval is unnecessary. Freeze current source revisions and exact IC section/term/assignment/component/10-point bindings. Fill eligible blanks or raise lower scores only; retain higher IC grades, Exempt flags/comments and history. Save/reload/read back exact cells. An uncertain save stops writes and is never retried or cleared automatically. Preparation, ACTIVE schedules, ready extensions, open tabs or delivered receipts do not prove entry. Reconcile actual receipts and IC evidence; give one precise review/recovery step, never ask for another Save after verified saving.\n\nSkip Week 01 cases and the exact Forensics Inductive and Deductive Reasoning lesson in 2026–27; Katherine confirms Reasoning is dealt with. Preserve their work, existing grades and history. Retain Week 01 Lab Safety, unrelated work and other confirmed exclusions. For readable, identified/matched received copies, count meaningful usable Notes/Concept Bank and Revision codes separately, retaining coded blanks in their denominators. Missing codes/scores, unfinished work and mistakes do not hold grades; zero denominators are N/A, never zeros. Never borrow absent/newer teacher tasks or count examples such as Carbon's Grass. Access/identity/wrong lesson and ambiguous response regions remain separate safeguards. Readiness checks embedded codes, not teacher reference contracts; use Needs embedded codes and ordinary explanations.\n\nOnly exact registered Biology Photosynthesis is repair-first. Its named teacher Form subject precedes mixed weekly topics: Cellular Respiration does not inherit the exception. Generic/raw-URL labels cannot establish another subject; student filenames never choose policy. Photosynthesis is not turned in yet: verified empty intake waits, with no student-score verification, nonexistent-copy repair or zero. Keep its final checklist step pending. On an eligible original's receipt, or verification of an existing distributed copy through authorized Agenda-page-one repair, embed missing codes preserving answers/history, verify saved revision/count, rerun normal grading and verify higher-only IC results. Empty uploads alone do not prove distributed copies absent.\n\nUse the deployed archive for exact Agenda class/weeks: file a content-verified copy of each distinct source revision in the student's existing private class folder alongside feedback, preserving original sources/intake and all history. Unique fresh course/section/name can authorize