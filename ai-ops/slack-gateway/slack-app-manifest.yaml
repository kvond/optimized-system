display_information:
  name: Optimize Router
  description: Routes Katherine's #optimize-me intake into the existing AI work channels.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: Optimize Router
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - chat:write
      - chat:write.public
settings:
  event_subscriptions:
    request_url: https://REPLACE_WITH_CLOUD_RUN_URL/slack/events
    bot_events:
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
