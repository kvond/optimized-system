name: System Review fallback
on:
  schedule:
    - cron: "0 7 * * 1"   # fallback after the Sunday Claude Code primary
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip if Claude Code primary already produced this week's report
        id: gate
        run: |
          D=$(date +%F)
          if [ -f "ai-ops/reports/system-review/$D.md" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run fallback review
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SYSTEM_REVIEW_WEBHOOK }}
        run: python tools/system_review.py
      - name: Save fallback report on a branch
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "system-review"
          git config user.email "system-review@users.noreply.github.com"
          B="claude/system-review-$(date +%F)"
          git checkout -b "$B"
          git add ai-ops/reports/system-review
          git commit -m "System Review fallback $(date +%F)" || exit 0
          git push origin "$B"
